# Supervised Fine-Tuning (SFT) Stage 2 Configuration for 54.5M SLM
# Fine-grained factual polish & CoT alignment from exp_010_sft/checkpoints/best.pt

training:
  # SFT mode flags
  is_sft: true
  reset_optimizer: true
  continuation_warmup_steps: 25

  # Batch size
  micro_batch_size: 4
  gradient_accumulation_steps: 8       # Effective batch = 32 conversations per step
  max_seq_len: 1024

  # Epochs & Steps (5 epochs over 5,001 dense Stage 2 examples -> 780 steps)
  epochs: 5
  max_steps: 780

  # Learning Rate Schedule (Targeted alignment LR)
  schedule: cosine
  learning_rate: 5.0e-5                # Stronger factual alignment LR
  min_learning_rate: 2.0e-6            # Floor LR
  warmup_ratio: 0.03                   # 3% warmup (~20 steps)


  # Optimizer (AdamW)
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0

  # Precision
  precision: auto                      # auto: bf16 -> fp16 -> fp32

  # Memory optimization
  gradient_checkpointing: false

  # EMA
  ema_decay: 0.999

  # Logging & Checkpointing
  validation_interval: 50              # Validate every 50 steps
  checkpoint_interval: 100             # Save checkpoint every 100 steps
  log_interval: 1                      # Log every step

  # Reproducibility
  seed: 42
  num_workers: 0
