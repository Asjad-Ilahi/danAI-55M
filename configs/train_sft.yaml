# Supervised Fine-Tuning (SFT) configuration for 54.5M SLM
# Fine-tunes pre-trained 237M-token base model on the 10M-token curated SFT mixture

training:
  # SFT mode flags
  is_sft: true
  reset_optimizer: true                # Fresh optimizer for fine-tuning
  continuation_warmup_steps: 30

  # Batch size
  micro_batch_size: 4                  # Micro batch size
  gradient_accumulation_steps: 8       # Effective batch = 32 conversations per step
  max_seq_len: 1024                    # Maximum conversation context length

  # Epochs & Steps (2 epochs over 10M tokens -> ~600 steps)
  epochs: 2
  max_steps: 610

  # Learning Rate Schedule (Cosine decay for SFT)
  schedule: cosine
  learning_rate: 2.5e-5                # Conservative SFT learning rate to preserve pretrained representations
  min_learning_rate: 1.0e-6            # Floor LR
  warmup_ratio: 0.05                   # 5% warmup (~30 steps)

  # Optimizer (AdamW)
  weight_decay: 0.01                   # Lower weight decay for SFT
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0                       # Max gradient norm

  # Precision
  precision: auto                      # auto: bf16 -> fp16 -> fp32

  # Memory optimization
  gradient_checkpointing: false

  # EMA
  ema_decay: 0.999

  # Logging & Checkpointing
  validation_interval: 25              # Validate & run qualitative generation test every 25 steps
  checkpoint_interval: 50              # Save checkpoint every 50 steps
  log_interval: 1                      # Log every step

  # Reproducibility
  seed: 42
  num_workers: 0
