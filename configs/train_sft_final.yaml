# Supervised Fine-Tuning (SFT) Final Configuration for 54.5M SLM
# Balanced factual alignment from exp_010_sft/checkpoints/best.pt

training:
  # SFT mode flags
  is_sft: true
  reset_optimizer: true
  continuation_warmup_steps: 40

  # Batch size
  micro_batch_size: 4
  gradient_accumulation_steps: 8       # Effective batch = 32 conversations per step
  max_seq_len: 1024

  # Epochs & Steps (2 epochs over 19,477 balanced examples -> 1,220 steps)
  epochs: 2
  max_steps: 1220

  # Learning Rate Schedule (Gentle cosine decay for balanced refinement)
  schedule: cosine
  learning_rate: 2.0e-5                # Conservative fine-tuning LR
  min_learning_rate: 1.0e-6            # Floor LR
  warmup_ratio: 0.05                   # 5% warmup (~60 steps)

  # Optimizer (AdamW)
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0

  # Precision
  precision: auto                      # auto: bf16 -> fp16 -> fp32

  # Memory optimization
  gradient_checkpointing: false

  # EMA
  ema_decay: 0.999

  # Logging & Checkpointing
  validation_interval: 100             # Validate every 100 steps
  checkpoint_interval: 200             # Save checkpoint every 200 steps
  log_interval: 1                      # Log every step

  # Reproducibility
  seed: 42
  num_workers: 0
