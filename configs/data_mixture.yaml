# Dataset mixture configuration
# Supports named sources with explicit upsample weights (§9).
# The upsample_weight controls how frequently documents from each source
# appear in training, independent of the source's natural document count.
# A small high-quality source can be over-represented via upsample_weight.

data_mixture:
  # Mixture weights for the main training phase (stable LR phase in WSD)
  main:
    - name: "primary"
      path: "data/raw"
      weight: 1.0                # Relative weight (normalized at load time)
      upsample_weight: 1.0       # 1.0 = no upsampling, >1.0 = oversample

  # Mixture weights for the annealing phase (final decay in WSD schedule)
  # This is the "high-quality cooldown" — heavily biased toward curated data.
  annealing:
    - name: "primary"
      path: "data/raw"
      weight: 1.0
      upsample_weight: 1.0

  # Global settings
  settings:
    validate_weights: true       # Ensure weights are positive
    seed: 42                     # For reproducible sampling
