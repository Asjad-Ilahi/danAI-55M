# Debug configuration (§52)
# Tiny model for rapid pipeline testing — runs in minutes.
# NEVER confuse this with the real 75M config.

model:
  vocab_size: 2048
  max_seq_len: 128
  hidden_size: 128
  num_layers: 2
  num_query_heads: 4
  num_kv_heads: 2
  intermediate_size: auto       # → 384 (128 * 8/3 rounded to 256 multiple)
  dropout: 0.0
  attention_dropout: 0.0
  rms_norm_eps: 1.0e-5
  rope_theta: 10000
  use_bias: false
  tie_embeddings: true
  residual_scale_init: true

training:
  micro_batch_size: 2
  gradient_accumulation_steps: 4
  max_seq_len: 128
  max_tokens: 100000              # 100K tokens — just enough to verify pipeline
  schedule: wsd
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  annealing_fraction: 0.08
  warmup_ratio: 0.02
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0
  precision: auto
  gradient_checkpointing: false   # Not needed for tiny model
  ema_decay: 0.999
  validation_interval: 50
  checkpoint_interval: 100
  log_interval: 5
  seed: 42
  num_workers: 0
  pack_with_document_mask: true
